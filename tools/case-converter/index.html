<!DOCTYPE html>

<head>

  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#059669" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="../../manifest.json" />
  <title>Case Converter - UPPERCASE, lowercase, Title, camelCase, snake_case & 15+ Formats - Numbora</title>
  <meta name="description" content="Free online case converter. Convert text between 15+ case formats including UPPERCASE, lowercase, Title Case, camelCase, PascalCase, snake_case, kebab-case, and CONSTANT_CASE instantly." />
  <link rel="icon" type="image/svg+xml" href="../../public/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    .case-btn-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .case-action-btn {
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>
  <!-- Header Navbar -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../../index.html" class="brand-logo" title="Numbora - Count On Everything">
        <img src="../../assets/images/logo-icon.png" alt="Numbora Logo" class="brand-logo-img" />
        <span>Num<span class="brand-highlight">bora</span></span>
      </a>
      <ul class="nav-links" id="nav-links">
        <li><a href="../../index.html" class="nav-link">Home</a></li>
        <li><a href="../word-counter/index.html" class="nav-link">Word Counter</a></li>
        <li><a href="../case-converter/index.html" class="nav-link active">Text Tools</a></li>
        <li><a href="../unit-converter/index.html" class="nav-link">Converters</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-btn" id="theme-toggle" aria-label="Toggle Theme">🌙</button>
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      </div>
    </div>
  </header>

  <main class="container" style="flex: 1; padding-bottom: 60px;">
    <nav class="breadcrumb-nav">
      <ul class="breadcrumb-list">
        <li><a href="../../index.html">Home</a></li>
        <li>/</li>
        <li><a href="../../index.html#text-tools">Text Tools</a></li>
        <li>/</li>
        <li style="color: var(--text-main);">Case Converter</li>
      </ul>
    </nav>

    <div style="margin-bottom: 24px;">
      <span class="badge badge-text">Text Tool</span>
      <h1 style="font-size: 2rem; margin: 6px 0 4px 0;">Case Converter</h1>
      <p style="color: var(--text-sub);">Convert text across 15+ writing and programming case formats instantly.</p>
    </div>

    <!-- Quick Conversion Action Button Toolbar -->
    <div class="case-btn-bar">
      <button class="btn btn-secondary case-action-btn" data-convert="uppercase">UPPERCASE</button>
      <button class="btn btn-secondary case-action-btn" data-convert="lowercase">lowercase</button>
      <button class="btn btn-secondary case-action-btn" data-convert="titlecase">Title Case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="sentencecase">Sentence case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="camelcase">camelCase</button>
      <button class="btn btn-secondary case-action-btn" data-convert="pascalcase">PascalCase</button>
      <button class="btn btn-secondary case-action-btn" data-convert="snakecase">snake_case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="kebabcase">kebab-case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="constantcase">CONSTANT_CASE</button>
      <button class="btn btn-secondary case-action-btn" data-convert="dotcase">dot.case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="pathcase">path/case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="alternatingcase">aLtErNaTiNg CaSe</button>
      <button class="btn btn-secondary case-action-btn" data-convert="invertcase">InVeRt cAsE</button>
      <button class="btn btn-secondary case-action-btn" data-convert="traincase">Train-Case</button>
      <button class="btn btn-secondary case-action-btn" data-convert="slugcase">URL Slug</button>
    </div>

    <!-- Primary Input Card -->
    <div class="card" style="margin-bottom: 24px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
        <label class="input-label" for="case-input" style="font-size: 1rem; font-weight: 700; margin: 0;">Main Input Text Box</label>
        <div style="display: flex; gap: 8px;">
          <button id="btn-sample" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">✨ Sample Text</button>
          <button id="btn-copy-input" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;">📋 Copy Text</button>
          <button id="btn-clear" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">Clear</button>
        </div>
      </div>
      <textarea id="case-input" class="input-control" rows="6" placeholder="Type or paste your text here..." style="font-family: inherit; font-size: 1rem; line-height: 1.6; padding: 16px;"></textarea>
    </div>


    <!-- Dynamic 15+ Case Cards Grid -->
    <div id="case-cards-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
      <!-- Generated dynamically by script.js -->
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="../../assets/images/logo-icon.png" alt="Numbora" style="width: 22px; height: 22px; object-fit: contain;" />
        <span style="font-weight: 700; color: var(--text-main);">Numbora</span>
        <span style="color: var(--text-muted); font-size: 0.75rem;">• Count on Everything</span>
      </div>
      <div>© 2026 Numbora. Fast & private web tools.</div>
    </div>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/utilities.js"></script>
  <script src="script.js"></script>
</body>
</html>
